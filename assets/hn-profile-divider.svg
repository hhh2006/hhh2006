<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 44" width="1200" height="44" role="img" aria-labelledby="title desc">
  <title id="title">HN section divider</title>
  <desc id="desc">Cyan gradient rule with a centered HN diamond node.</desc>

  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#168BFF" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#00D9FF" stop-opacity="1"/>
      <stop offset="0.65" stop-color="#168BFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="21" width="1200" height="2" fill="url(#line)"/>
  <rect x="556" y="19" width="26" height="4" fill="#168BFF" fill-opacity="0.9"/>
  <rect x="618" y="19" width="26" height="4" fill="#168BFF" fill-opacity="0.9"/>
  <rect x="592" y="13" width="16" height="16" transform="rotate(45 600 21)" fill="#00D9FF"/>
  <rect x="596" y="17" width="8" height="8" transform="rotate(45 600 21)" fill="#080B12"/>
</svg>
