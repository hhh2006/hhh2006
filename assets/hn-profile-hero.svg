<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
  <title id="title">HN — Hani Khaled Nasser Al-Nasseri</title>
  <desc id="desc">Cinematic HN identity banner: cybersecurity engineering, OSCP journey, GitHub hhh2006.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#080B12"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00D9FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mono" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F5F9"/>
      <stop offset="0.62" stop-color="#C7D0DC"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#168BFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#168BFF" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#080B12"/>
      <stop offset="0.18" stop-color="#080B12" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#080B12" stop-opacity="0"/>
      <stop offset="1" stop-color="#080B12"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <rect width="1200" height="420" fill="url(#vignette)" opacity="0.55"/>
  <ellipse cx="255" cy="212" rx="315" ry="245" fill="url(#glow)"/>

  <!-- frame -->
  <rect x="20" y="20" width="1160" height="380" fill="none" stroke="#168BFF" stroke-opacity="0.35" stroke-width="1.5"/>
  <g fill="none" stroke="#00D9FF" stroke-width="3.5" stroke-linecap="square">
    <path d="M20 66V20h46"/>
    <path d="M1134 20h46v46"/>
    <path d="M1180 354v46h-46"/>
    <path d="M66 400H20v-46"/>
  </g>

  <!-- monogram -->
  <text x="72" y="278" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="170" font-weight="700" letter-spacing="6" fill="url(#mono)">HN</text>
  <text x="72" y="278" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="170" font-weight="700" letter-spacing="6" fill="none" stroke="#00D9FF" stroke-opacity="0.30" stroke-width="1.5">HN</text>
  <text x="76" y="322" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="13" letter-spacing="5" fill="#00D9FF" fill-opacity="0.9">GITHUB.COM/HHH2006</text>

  <!-- divider -->
  <line x1="404" y1="76" x2="404" y2="344" stroke="#168BFF" stroke-opacity="0.55" stroke-width="1"/>
  <rect x="397" y="203" width="14" height="14" transform="rotate(45 404 210)" fill="#00D9FF"/>
  <rect x="401" y="207" width="6" height="6" transform="rotate(45 404 210)" fill="#080B12"/>

  <!-- identity block -->
  <text x="452" y="128" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="6.5" fill="#00D9FF">CYBERSECURITY ENGINEERING · HN</text>
  <text x="452" y="186" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="700" letter-spacing="2" fill="#F1F5F9">HANI KHALED NASSER AL-NASSERI</text>
  <text x="452" y="230" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="1.6" fill="#C7D0DC">Cybersecurity Student · OSCP Journey</text>
  <rect x="452" y="252" width="360" height="2" fill="url(#accent)"/>
  <text x="452" y="292" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="13" letter-spacing="3" fill="#C7D0DC" fill-opacity="0.9">PYTHON · C++ · JAVA · C# · PHP · JAVASCRIPT · SQL</text>
  <text x="452" y="322" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="13" letter-spacing="3" fill="#C7D0DC" fill-opacity="0.62">KALI LINUX · NETWORK SECURITY · CRYPTOGRAPHY · BLUE TEAM</text>

  <!-- bottom accent -->
  <rect x="20" y="394" width="1160" height="4" fill="url(#accent)" opacity="0.75"/>
</svg>
